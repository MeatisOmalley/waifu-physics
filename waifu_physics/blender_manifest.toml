schema_version = "1.0.0"

id = "waifu_physics"
version = "1.0.0"
name = "Waifu Physics"
tagline = "Fast bone-chain physics for hair, skirts and accessories"
maintainer = "MeatisOmalley"
type = "add-on"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 MeatisOmalley", "2019-2026 pafuhana1213 (Kawaii Physics)"]

tags = ["Animation", "Physics", "Rigging"]

[build]
# The C source ships with the package; compiler leftovers do not.
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "*.obj",
  "*.exp",
  "*.lib",
]
